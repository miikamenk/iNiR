# herdr configuration — rendered by iNiR's unified wallpaper-color pipeline.
#
# DO NOT EDIT THIS FILE: it is regenerated from
# ~/.config/matugen/templates/herdr/config.toml on every wallpaper or
# light/dark change, and your edits here are lost at that point. Change the
# template instead — both the settings below and the colors live in it.
#
# herdr has no include mechanism, so the whole config has to be rendered, not
# just the theme block.

# Show first-run notification setup on startup.
onboarding = false

[theme]
# Base theme. Every token herdr lets us override is set from the wallpaper
# palette below, so this only supplies the handful it does not expose.
name = "catppuccin"

# Material You palette, current light/dark variant.
#
# The tokens map onto herdr's catppuccin-shaped names by role, not by hue:
# the surface ladder is the Material elevation ladder, and the named colors
# are the semantic families the rest of iNiR uses (accent, error, success,
# warning), so a herdr pane reads as part of the same desktop.
[theme.custom]
# Chrome background — the Material background, the same color the shell's
# panels and the terminal background are derived from.
panel_bg = "{{colors.background.default.hex}}"

# Surface ladder: dim → surface0 → surface1 climbs the elevation steps.
surface_dim = "{{colors.surface_container_low.default.hex}}"
surface0 = "{{colors.surface_container.default.hex}}"
surface1 = "{{colors.surface_container_high.default.hex}}"

# Borders and dividers.
overlay0 = "{{colors.outline_variant.default.hex}}"
overlay1 = "{{colors.outline.default.hex}}"

# Text: subtext0 is the dimmed label color, text the primary one. Both are
# contrast-checked against the surfaces above by the palette generator.
# `onSurface`, not `on_surface`: the renderer registers the Material token
# under both spellings and the app palette overwrites the snake_case one, so
# only the camelCase spelling reliably resolves to the terminal foreground.
subtext0 = "{{colors.on_surface_variant.default.hex}}"
text = "{{colors.onSurface.default.hex}}"

# Accent — highlights, focused pane borders, navigation UI.
accent = "{{colors.primary.default.hex}}"

# Named colors. Material has one hue family per semantic role, so these follow
# the role, not the catppuccin name: mauve is the tone-shifted accent (a
# sibling of `accent`, not a duplicate) and peach is the pale end of the
# warning family.
red = "{{colors.error.default.hex}}"
green = "{{colors.success.default.hex}}"
yellow = "{{colors.app_warning.default.hex}}"
peach = "{{colors.app_on_warning_container.default.hex}}"
blue = "{{colors.secondary.default.hex}}"
teal = "{{colors.tertiary.default.hex}}"
mauve = "{{colors.app_accent_hover.default.hex}}"

[ui]
# Show detected/reported agent labels in split pane borders when no manual
# pane name is set.
show_agent_labels_on_pane_borders = true

[ui.sound]
# Play sounds when agents change state in background workspaces.
enabled = false

[ui.toast]
# Background notification popup delivery: ask the OS notification service
# directly, so herdr's toasts land in the shell's notification list.
delivery = "system"

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = false
# Local Kitty graphics rendering for attached clients.
kitty_graphics = true
